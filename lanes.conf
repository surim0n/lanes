# lanes.conf — the only place model names live.
#
# Resolution order (last wins): this file → <project>/.claude/lanes.conf
#   → $LANES_CONF → env (LANES_ROUTINE_MODEL, LANES_ESCALATE_TIMEOUT, …)
#   → `lanes run --model/--timeout` flags.
#
# `lanes doctor` cross-checks these slugs and effort rungs against the
# model list your Codex CLI has cached, so a stale slug fails loudly.

# Routine lane: the spec fully determines the outcome. Default for everything.
routine.model   = gpt-5.6-luna
routine.efforts = low medium high xhigh max
routine.timeout = 600

# Escalation lane: judgment the spec can't carry. One-offs, never the default.
escalate.model   = gpt-5.6-sol
escalate.efforts = low medium high xhigh max ultra
escalate.timeout = 1800

# Wall clock for re-running the spec's PROVE command after the lane finishes.
prove.timeout = 600
