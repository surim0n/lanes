<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="lanes: architect mode for Claude Code">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1116"/>
      <stop offset="1" stop-color="#181c26"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b93a7"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <g stroke="#232837" stroke-width="1">
    <path d="M0 160 H1280 M0 480 H1280"/>
  </g>

  <!-- wordmark -->
  <text x="88" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="72" font-weight="700" fill="#f2f4f8" letter-spacing="-2">lanes</text>
  <text x="300" y="118" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#8b93a7">architect mode for Claude Code</text>

  <!-- pipeline -->
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <!-- architect -->
    <rect x="88" y="236" width="300" height="168" rx="14" fill="#161a24" stroke="#2c3345" stroke-width="2"/>
    <text x="112" y="278" font-size="15" fill="#8b93a7" letter-spacing="2">SESSION</text>
    <text x="112" y="318" font-size="30" font-weight="600" fill="#f2f4f8">architect</text>
    <text x="112" y="352" font-size="18" fill="#aeb5c6">designs · specs · judges</text>
    <text x="112" y="380" font-size="18" fill="#e5533d">never edits (hook)</text>

    <!-- lanes -->
    <rect x="490" y="236" width="300" height="168" rx="14" fill="#161a24" stroke="#2c3345" stroke-width="2"/>
    <text x="514" y="278" font-size="15" fill="#8b93a7" letter-spacing="2">CODEX LANES</text>
    <text x="514" y="318" font-size="30" font-weight="600" fill="#f2f4f8">routine · escalate</text>
    <text x="514" y="352" font-size="18" fill="#aeb5c6">effort named per task</text>
    <text x="514" y="380" font-size="18" fill="#4fb3a3">diff hashed · verify re-run</text>

    <!-- reviewer -->
    <rect x="892" y="236" width="300" height="168" rx="14" fill="#161a24" stroke="#2c3345" stroke-width="2"/>
    <text x="916" y="278" font-size="15" fill="#8b93a7" letter-spacing="2">CLEAN CONTEXT</text>
    <text x="916" y="318" font-size="30" font-weight="600" fill="#f2f4f8">reviewer</text>
    <text x="916" y="352" font-size="18" fill="#aeb5c6">ship · fix · rethink</text>
    <text x="916" y="380" font-size="18" fill="#e5533d">read-only (hook)</text>

    <!-- arrows -->
    <g stroke="#8b93a7" stroke-width="3" fill="none" marker-end="url(#arrow)">
      <path d="M392 320 H480"/>
      <path d="M794 320 H882"/>
    </g>
    <text x="404" y="304" font-size="14" fill="#8b93a7">spec</text>
    <text x="806" y="304" font-size="14" fill="#8b93a7">report</text>

    <!-- gate -->
    <text x="88" y="548" font-size="22" fill="#aeb5c6">Stop hook: no "done" until the tree has a ship verdict.</text>
    <text x="88" y="586" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#6f788c">/plugin marketplace add surim0n/lanes</text>
  </g>
</svg>
